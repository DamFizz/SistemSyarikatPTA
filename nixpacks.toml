[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "nodejs_20"]
nixLibs = ["libmysqlclient"]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm ci",
    "npm run build"
]

[start]
cmd = "php artisan migrate --force --no-interaction && php artisan storage:link --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=$PORT"
