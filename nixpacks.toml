[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "nodejs_20"]
nixLibs = ["libmysqlclient"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction"]

[phases.build]
cmds = [
    "npm ci",
    "npm run build"
]

[start]
cmd = "php artisan migrate --force --no-interaction && php artisan db:seed --force && php artisan storage:link --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && PHP_CLI_SERVER_WORKERS=4 php -S 0.0.0.0:$PORT -t public server-router.php"
